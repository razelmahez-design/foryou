<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Special Girl 🤍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            padding: 20px;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 25px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #ffb6c1;
            letter-spacing: 1px;
        }

        .message-box {
            font-size: 1.15rem;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            padding: 0 10px;
            color: #f1f1f1;
            line-height: 1.6;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .btn {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border: none;
            color: white;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
            transition: 0.3s ease;
            font-weight: 600;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .heart {
            position: absolute;
            color: #ff4757;
            font-size: 20px;
            z-index: 1;
            user-select: none;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <div class="container">
        <h1>For My Special Girl 🤍</h1>
        <div class="message-box" id="messageText">Tekan tombol di bawah ya...</div>
        <button class="btn" id="nextBtn" onclick="showMessageAndHeart()">Buka Pesan ❤️</button>
    </div>

    <script>
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 3 + 1) + 's';
            starsContainer.appendChild(star);
        }

        // Daftar kata-kata cinta khusus (tanpa lirik lagu)
        const messages = [
            "Hai kamu... Cuman mau bilang, terima kasih ya udah hadir di hidup aku 🤍",
            "Kehadiran kamu itu hal paling indah yang pernah aku punya.",
            "Walaupun ada jarak atau kesibukan, kamu selalu ada di dalam pikiran aku.",
            "Tetap jadi cewek yang manis, baik, dan jangan gampang nyerah ya sayang.",
            "Aku beruntung banget bisa kenal dan miliki kamu.",
            "Senyum kamu itu rumah buat aku.",
            "I love you so much, hari ini, esok, dan selamanya! 💖"
        ];

        let currentIndex = 0;

        function showMessageAndHeart() {
            const btn = document.getElementById('nextBtn');
            btn.innerText = "Ketuk untuk Lanjut ✨";

            showNextMessage();
            createHeartEffect();
        }

        function showNextMessage() {
            const msgBox = document.getElementById('messageText');
            
            let text = messages[currentIndex];
            msgBox.innerHTML = "";
            let charIndex = 0;

            function typeWriter() {
                if (charIndex < text.length) {
                    msgBox.innerHTML += text.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, 45);
                }
            }
            typeWriter();

            currentIndex = (currentIndex + 1) % messages.length;
        }

        function createHeartEffect() {
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerHTML = '❤️';
                    heart.style.left = Math.random() * window.innerWidth + 'px';
                    heart.style.fontSize = (Math.random() * 22 + 16) + 'px';
                    document.body.appendChild(heart);

                    setTimeout(() => {
                        heart.remove();
                    }, 4000);
                }, i * 200);
            }
        }
    </script>
</body>
</html>
