<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Up Your Day! ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            padding: 20px;
        }

        /* Efek bintang game retro */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 1.5s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Kotak Dialog ala Game RPG */
        .game-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: rgba(16, 16, 35, 0.85);
            border: 4px solid #ff758c;
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(255, 117, 140, 0.3), inset 0 0 15px rgba(255, 117, 140, 0.2);
            text-align: center;
        }

        /* Header Game */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            color: #ffb6c1;
        }

        .heart-icon {
            color: #ff4757;
            animation: pulseBeat 1s infinite alternate;
        }

        @keyframes pulseBeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.25); }
        }

        /* Layar Teks Dialog */
        .dialogue-box {
            background: rgba(0, 0, 0, 0.5);
            border: 2px dashed #ff7eb3;
            border-radius: 8px;
            padding: 20px 15px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            color: #f1f1f1;
            line-height: 1.6;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Tombol ala Controller Game */
        .btn {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border: 2px solid #fff;
            color: white;
            padding: 12px 25px;
            font-size: 0.9rem;
            font-family: 'Press Start 2P', monospace;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 117, 140, 0.5);
            transition: 0.2s ease;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(255, 117, 140, 0.5);
        }

        /* Animasi Hati Bertebaran */
        .floating-heart {
            position: absolute;
            color: #ff4757;
            font-size: 20px;
            z-index: 1;
            user-select: none;
            pointer-events: none;
            animation: floatUp 3.5s linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(20deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Background Bintang Retro -->
    <div class="stars" id="stars"></div>

    <div class="game-container">
        <!-- Status Bar Game -->
        <div class="game-header">
            <span>QUEST: LOVE ❤️</span>
            <span class="heart-icon">❤️❤️❤️</span>
        </div>

        <!-- Kotak Teks -->
        <div class="dialogue-box" id="dialogueText">Tekan tombol Start untuk mulai...</div>

        <!-- Tombol Aksi -->
        <div style="text-align: center;">
            <button class="btn" id="actionBtn" onclick="nextDialogue()">START ▶</button>
        </div>
    </div>

    <script>
        // Membuat latar belakang bintang kecil
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 40; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 2 + 1) + 's';
            starsContainer.appendChild(star);
        }

        // Kata-kata sesuai permintaan kamu
        const dialogues = [
            "hai, kamu...",
            "semangat terus ya...",
            "ingat, jangan mudah menyerah!",
            "Aku selalu dukung kamu dari sini ✨",
            "You win my heart! ❤️"
        ];

        let index = 0;
        let isStarted = false;

        function nextDialogue() {
            const btn = document.getElementById('actionBtn');
            
            if (!isStarted) {
                isStarted = true;
                btn.innerText = "LANJUT ➔";
            }

            playDialogue();
            createHeartAnimation();
        }

        function playDialogue() {
            const box = document.getElementById('dialogueText');
            let text = dialogues[index];
            box.innerHTML = "";
            let charIdx = 0;

            // Efek mengetik teks ala game RPG
            function typeWriter() {
                if (charIdx < text.length) {
                    box.innerHTML += text.charAt(charIdx);
                    charIdx++;
                    setTimeout(typeWriter, 45);
                }
            }
            typeWriter();

            // Pindah ke kalimat berikutnya, kalau habis berputar kembali atau berhenti
            index = (index + 1) % dialogues.length;
        }

        // Efek animasi hati melayang saat tombol diklik
        function createHeartAnimation() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('floating-heart');
                    heart.innerHTML = '💖';
                    heart.style.left = Math.random() * window.innerWidth + 'px';
                    heart.style.fontSize = (Math.random() * 20 + 16) + 'px';
                    document.body.appendChild(heart);

                    setTimeout(() => {
                        heart.remove();
                    }, 3500);
                }, i * 150);
            }
        }
    </script>
</body>
</html>
